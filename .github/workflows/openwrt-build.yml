name: Build OpenWrt with NSS for Linksys MX5300

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex gawk \
            gcc-multilib git make ncurses-dev libssl-dev \
            unzip wget rsync

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Set defconfig
        run: make defconfig V=s

      - name: Download sources
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run: make -j$(nproc) V=s
        env:
          KBUILD_BUILD_USER: "build"
          KBUILD_BUILD_HOST: "theiakos.com"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-mx5300
          path: bin/targets/


  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: openwrt-nss-mx5300
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "24.10"
          name: 24.10-nss (${{ env.RELEASE_DATE }})
          files: |
            release-files/openwrt-*-factory.bin
            release-files/openwrt-*-sysupgrade.bin
            release-files/sha256sums
          overwrite: true
