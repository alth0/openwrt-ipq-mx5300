name: Build 24.10-nss for Linksys MX5300

on:
  schedule:
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex gawk \
            gcc-multilib git make ncurses-dev libssl-dev \
            unzip wget rsync

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        
      - name: Set defconfig
        run: make defconfig V=s

      - name: Download sources
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run:  make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-mx5300
          path: bin/targets/
          retention-days: 1


