name: Create Draft Release

on:
  workflow_dispatch:

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Set release tag
        run: |
          DATE=$(date +'%Y%m%d')
          echo "RELEASE_TAG=24.10-nss-nightly-${DATE}" >> $GITHUB_ENV

      - name: Create draft release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          draft: true
